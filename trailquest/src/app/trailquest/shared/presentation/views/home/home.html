<section>
  <h1>{{ 'home-title' | translate }}</h1>
  <p>{{ 'home-subtitle' | translate }}</p>

  <h2>{{ 'my-adventure-camps' | translate }}</h2>
  @if (error()) {
    <p role="alert">{{ 'error-load-data' | translate }}</p>
  }
  <mat-grid-list [cols]="columns()" rowHeight="360px" gutterSize="16px">
    @for (adventureCamp of adventureCamps(); track adventureCamp.id) {
      <mat-grid-tile>
        <app-adventure-camp-summary [adventureCamp]="adventureCamp"/>
      </mat-grid-tile>
    }
  </mat-grid-list>
</section>
